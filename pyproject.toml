[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-thoughts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.15,<2", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "tzdata>=2025.1", "filelock>=3.17,<4", "av>=14,<19", "numpy>=1.26,<3"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
local = ["faster-whisper>=1.1,<2"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
